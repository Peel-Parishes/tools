<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peel Parishes — Newsletter Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Team Tools">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --db:#8A6A2F; --fz:#1F5F6B; --mo:#A4462E; --cw:#573984;
  --ink:#16211F; --limewash:#EFF1EF; --paper:#F7F8F6; --stone:#D5D8D3; --muted:#5C6660;
  --disp:Marcellus,Georgia,serif; --bod:"Source Sans 3",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--limewash);color:var(--ink);font:17px/1.6 var(--bod);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.15;margin:0}
p{margin:0 0 14px}
.lab{font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:10px}
:focus-visible{outline:3px solid var(--fz);outline-offset:2px}

header{background:var(--ink);color:var(--paper);padding:18px 28px;display:flex;align-items:center;gap:22px}
header svg{width:46px;height:46px;flex:none}
header .lab{color:#8A918D;margin-bottom:3px}
header h1{color:var(--paper);font-size:1.45rem}
header p{color:#B9C0BC;margin:4px 0 0;font-size:.9rem;max-width:74ch}
/* Back to the landing page (10 Nov): the Home Screen app has no back button. */
header .home{margin-left:auto;align-self:flex-start;flex:none;color:#B9C0BC;font-weight:600;font-size:.9rem;
  text-decoration:none;white-space:nowrap;padding:12px 0 12px 14px;margin-top:-12px}
header .home:hover,header .home:focus-visible{color:#F7F8F6;text-decoration:underline}
@media (max-width:600px){ header{flex-wrap:wrap;row-gap:4px} header .home{order:-1;flex-basis:100%;margin:-10px 0 0;padding:10px 0} header>div{flex:1 1 0;min-width:0} }

.shell{display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr);min-height:calc(100vh - 92px)}
.pane{padding:0;position:relative;min-width:0}
.left{background:var(--paper);border-right:1px solid var(--stone);display:flex;flex-direction:column}
.right{background:var(--limewash);padding:22px 26px;min-width:0}

.steps{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--stone);background:#fff}
.steps button{flex:1;min-width:80px;font-family:var(--bod);font-weight:600;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;border:0;border-right:1px solid var(--stone);border-bottom:3px solid transparent;
  background:transparent;padding:12px 4px;cursor:pointer;color:var(--muted)}
.steps button:last-child{border-right:0}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);background:var(--paper)}
.steps .dot{display:block;font-size:.6rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.body{padding:22px 28px 40px;overflow-y:auto;flex:1}

label{display:block;font-size:.85rem;font-weight:600;margin:16px 0 6px}
label span.opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--stone);background:#fff;
  font-family:var(--bod);font-size:.97rem;color:var(--ink);border-radius:0}
textarea{resize:vertical;min-height:64px}
.hint{font-size:.81rem;color:var(--muted);margin-top:5px}
.hint.warn{color:var(--mo);font-weight:600}
.hint.good{color:var(--fz);font-weight:600}
.count{font-size:.73rem;font-weight:600;color:var(--muted);float:right}
.count.over{color:var(--mo)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.btn{display:inline-block;background:var(--ink);color:var(--paper);padding:10px 18px;border:1px solid var(--ink);
  font-family:var(--bod);font-weight:600;font-size:.92rem;cursor:pointer}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.sm{padding:7px 12px;font-size:.83rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}

fieldset{border:1px solid var(--stone);background:#fff;padding:2px 15px 16px;margin:16px 0 0}
legend{font-weight:600;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 7px}
ol.brief{padding-left:20px;margin:0 0 4px;font-size:.92rem;color:var(--muted)}
ol.brief li{margin-bottom:6px}
ol.brief strong{color:var(--ink)}

.pick{display:grid;gap:5px;margin-top:6px}
.pick button{font-family:var(--bod);font-size:.9rem;text-align:left;cursor:pointer;border:1px solid var(--stone);
  background:#fff;color:var(--ink);display:flex;align-items:stretch;padding:0;overflow:hidden}
.pick button .bar{width:9px;flex:none;background:var(--c)}
.pick button .nm{padding:8px 11px}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick button[aria-pressed="true"] .nm{font-weight:600}

.when{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.when button{font-family:var(--bod);font-size:.86rem;padding:8px 9px;cursor:pointer;border:1px solid var(--stone);
  background:#fff;color:var(--ink);text-align:left}
.when button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chips button{font-family:var(--bod);font-size:.77rem;padding:5px 10px;cursor:pointer;border:1px solid var(--stone);
  background:var(--paper);color:var(--ink)}
.chips button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.svcsec{margin-bottom:16px}
.svchead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.svchead .key{width:9px;height:16px;display:inline-block;flex:none}
.svchead .nm{font-weight:600;font-size:.87rem}
.svcnone{font-size:.81rem;color:var(--muted);margin:0 0 8px 18px}
.cwfull{display:flex;gap:9px;align-items:flex-start;font-size:.84rem;margin:0 0 9px 18px;font-weight:400;cursor:pointer}
.cwfull input{width:16px;height:16px;margin-top:2px;flex:none}
.cwfull small{color:var(--muted);display:block}
.svc{border:1px solid var(--stone);background:#fff;padding:10px 12px;margin:0 0 8px 18px;position:relative}
.svc .top{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.svc .swatch{width:9px;height:24px;flex:none;background:var(--c)}
.svc .ti{flex:1;border:1px solid var(--stone);padding:8px 10px}
.svc .x{border:1px solid var(--stone);background:#fff;cursor:pointer;width:26px;height:26px;flex:none;color:var(--muted)}
.svc .x:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.svcadd{margin-left:18px}

.queue{margin-top:8px;border-top:1px solid var(--stone)}
.qsec{font-weight:600;font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  padding:13px 0 5px;border-bottom:1px solid var(--stone)}
.qitem{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--stone)}
.qitem.on{background:rgba(31,95,107,.05)}
.qitem .bar{width:5px;align-self:stretch;min-height:30px;flex:none;background:var(--c)}
.qitem .t{flex:1;min-width:0;cursor:pointer}
.qitem .t b{display:block;font-weight:600;font-size:.92rem;line-height:1.3}
.qitem .t small{color:var(--muted);font-size:.79rem;display:block}
.qitem .acts{display:flex;gap:3px;flex:none}
.qitem .acts button{border:1px solid var(--stone);background:#fff;cursor:pointer;width:26px;height:26px;
  font-size:.82rem;color:var(--muted);line-height:1;padding:0}
.qitem .acts button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-weight:600;font-size:.59rem;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 6px;margin:4px 5px 0 0;border:1px solid currentColor}
.tag.open{color:var(--fz)} .tag.shut{color:var(--db)} .tag.run{color:var(--mo)}
.tag.done{color:var(--muted)} .tag.nolink{color:var(--db);border-style:dashed}
.tag.off{color:#fff;background:#8A918D;border-color:#8A918D}
.nudge{display:block;margin-top:5px;font-size:.77rem;font-weight:600;color:var(--fz);background:none;border:0;
  padding:0;cursor:pointer;text-align:left;text-decoration:underline}

.rd{display:grid;grid-template-columns:74px 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.rd .d{font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rd input{padding:7px 9px;font-size:.88rem}
.rdhead{display:grid;grid-template-columns:74px 1fr 1fr 1fr;gap:6px;margin-bottom:5px}
.rdhead span{font-weight:600;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{font-family:var(--bod);font-weight:600;font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid var(--stone);background:var(--paper);padding:8px 12px;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs .sp{margin-left:auto;display:flex;gap:5px;flex-wrap:nowrap}
.stage{background:var(--stone);padding:16px;overflow-x:auto;overflow-y:visible;max-height:calc(100vh - 260px);display:flex;justify-content:center;box-sizing:border-box}
.stage-inner{width:100%;max-width:700px;transition:max-width .15s}
.stage.phone .stage-inner{max-width:375px}
#previewFrame{border:0;background:#EFF1EF;display:block;width:700px;height:900px;transform-origin:top left}
.stage-inner{overflow:hidden}
pre{background:var(--ink);color:#CFE3E0;padding:16px;overflow:auto;font-family:ui-monospace,Menlo,monospace;
  font-size:.72rem;line-height:1.6;max-height:calc(100vh - 300px);margin:0;white-space:pre-wrap;word-break:break-word}
pre.plain{background:#fff;color:var(--ink);border:1px solid var(--stone);font-family:var(--bod);font-size:.86rem}

.meter{margin:8px 0 0;font-size:.76rem;line-height:1.5;color:var(--muted)}
.meter b{color:var(--ink);font-weight:600}
.meter #verdict{font-weight:600;color:var(--fz)}
.meter #verdict.warn{color:var(--db)} .meter #verdict.bad{color:var(--mo)}

.note{border-left:3px solid var(--fz);background:rgba(31,95,107,.06);padding:13px 16px;margin-top:16px;
  font-size:.86rem;color:var(--muted)}
.note b{display:block;color:var(--ink);font-weight:600;font-size:.63rem;letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:5px}
.note.warn{border-left-color:var(--mo);background:rgba(164,70,46,.07)}
.rdgap{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--mo);
  background:rgba(164,70,46,.07);color:var(--mo);font-size:.86rem;line-height:1.5}
.rdgap b{display:block;font-weight:600;margin-bottom:4px}
.rdgap ul{margin:0 0 6px;padding-left:18px}
.rdgap li{margin:2px 0}
.rdgap li b{display:inline;font-weight:600;margin:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--stone)}
.err{background:rgba(164,70,46,.07);border-left:3px solid var(--mo);padding:9px 13px;font-size:.85rem;color:var(--ink);margin-top:11px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:11px 22px;font-size:.89rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.on{opacity:1}
.review{position:absolute;inset:0;background:var(--paper);z-index:20;overflow-y:auto;padding:22px 28px}
.rv{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--stone)}
.rv input{margin-top:5px;flex:none;width:17px;height:17px;accent-color:#1F5F6B}
.rv .bar{width:5px;align-self:stretch;min-height:28px;flex:none;background:var(--c)}
.rv .t{flex:1;min-width:0}
.rv .t b{display:block;font-weight:600;font-size:.9rem}
.rv .t small{display:block;color:var(--muted);font-size:.78rem}
.rv .why{font-weight:600;font-size:.71rem;color:var(--fz)}
.rv .why.drop{color:var(--mo)}
.f{display:none}
/* Phones and tablets (10 Nov): 16px form text stops iPhone zooming in on every
   field you tap, and a tapped button no longer stays stuck in its hover colours. */
@media (pointer:coarse){ input,select,textarea{font-size:16px !important} }
/* Finger-sized controls on touch screens (10 Nov): 44px buttons, bigger tick boxes. */
@media (pointer:coarse){
  .svc .x,.qitem .acts button{width:44px;height:44px;font-size:1.05rem}
  .qitem .acts{gap:4px}
  input[type=checkbox]{width:22px !important;height:22px !important}
}
@media (hover:none){
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.ghost:hover{background:transparent;color:var(--ink)}
  .chips button:hover{background:var(--paper);color:var(--ink);border-color:var(--stone)}
  .svc .x:hover,.qitem .acts button:hover{background:#fff;color:var(--muted);border-color:var(--stone)}
}
/* The page runs edge to edge (viewport-fit=cover), so keep the masthead and
   form clear of the iPhone notch in landscape. */
header{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
.body{padding-left:max(28px,env(safe-area-inset-left))}
.right{padding-right:max(26px,env(safe-area-inset-right))}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .left{border-right:0;border-bottom:1px solid var(--stone)}
  /* Stacked view: the masthead scrolls away but the step tabs stay put, so you
     can jump between steps -- or tap the step you're on to get back to the top
     of it -- without scrolling up. */
  .steps{position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--stone),0 6px 14px rgba(22,33,31,.07)}
  /* And a way back down to the preview once it has scrolled out of sight. */
  .jump{position:fixed;right:calc(14px + env(safe-area-inset-right));
    bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;border:0;background:var(--ink);color:var(--paper);
    font-family:var(--bod);font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
    padding:12px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(22,33,31,.28);
    opacity:0;pointer-events:none;transition:opacity .2s}
  .jump.on{opacity:1;pointer-events:auto}
}
@media (min-width:1001px){ .jump{display:none} }

/* Wide view only: the two columns fill the window and scroll inside themselves,
   so the preview, the action buttons and the weight gauge all stay on screen
   however long the step you're editing is. Below 1000px the columns stack and
   the page scrolls normally -- none of this applies. */
@media (min-width:1001px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  header{flex:none}
  .shell{flex:1 1 0;height:auto;min-height:0;overflow:hidden}
  .pane{min-height:0}
  .left{min-height:0}
  .right{display:flex;flex-direction:column;overflow:hidden;padding-bottom:20px}
  .tabs{flex:none}
  #v-prev:not([hidden]),#v-plain:not([hidden]),#v-code:not([hidden]){
    flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .stage{flex:1 1 0;min-height:0;max-height:none;overflow-y:auto;align-items:flex-start}
  pre{flex:1 1 0;min-height:0;max-height:none}
  .row,.meter{flex:none}
  .row{margin-top:14px}
}
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-label="Peel Parishes woven mark">
    <rect x="0" y="20" width="90" height="20" fill="#D9392B"/><rect x="0" y="50" width="90" height="20" fill="#9457C4"/>
    <rect x="20" y="0" width="20" height="50" fill="#D4A24C"/><rect x="20" y="70" width="20" height="20" fill="#D4A24C"/>
    <rect x="50" y="0" width="20" height="20" fill="#0E8C9E"/><rect x="50" y="40" width="20" height="50" fill="#0E8C9E"/>
  </svg>
  <div>
    <span class="lab">Peel Parishes · Weekly email</span>
    <h1>Newsletter Builder</h1>
    <p>Work through the steps. The finished email builds itself.<br>Copy it into Mailchimp when you're done.</p>
  </div>
  <a class="home" href="./" aria-label="Back to Team tools">← Team tools</a>
</header>

<div class="shell">
  <section class="pane left">
    <div class="review" id="review" hidden></div>
    <div class="steps" id="steps" role="tablist"></div>
    <div class="body" id="stepbody"></div>
  </section>

  <section class="pane right">
    <div class="tabs">
      <button id="t-prev" aria-pressed="true">Preview</button>
      <button id="t-plain" aria-pressed="false">Plain text</button>
      <button id="t-code" aria-pressed="false">Code</button>
      <span class="sp"><button id="t-wide" aria-pressed="true">Desktop</button><button id="t-phone" aria-pressed="false">Phone</button></span>
    </div>
    <div id="v-prev"><div class="stage" id="stage"><div class="stage-inner"><iframe id="previewFrame" title="Email preview" scrolling="no"></iframe></div></div></div>
    <div id="v-plain" hidden><pre class="plain" id="plain"></pre></div>
    <div id="v-code" hidden><pre id="code"></pre></div>


    <p class="meter">Email weight: <b id="kb">0 KB</b> of the <b>102 KB</b> Gmail shows before it hides the rest behind &ldquo;Message clipped&rdquo;. <span id="verdict"></span></p>
  </section>
</div>

<input type="file" id="weekFile" accept=".json,application/json" class="f">
<button class="jump" id="jump" type="button">↓ Preview</button>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var mem={};
var store={
  set:function(k,v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); return; }catch(e){}
    mem[k]=v;
  },
  get:async function(k){
    try{ if(window.storage&&window.storage.get){ var r=await window.storage.get(k); return r&&r.value?r.value:null; } }catch(e){}
    try{ var s=localStorage.getItem(k); if(s!==null) return s; }catch(e){}
    return mem[k]||null;
  }
};

var CH=[
  {k:"db", label:"St Peter's, Drayton Bassett", pick:"Drayton Bassett",   c:"#8A6A2F"},
  {k:"fz", label:"St Paul's, Fazeley",          pick:"Fazeley",           c:"#1F5F6B"},
  {k:"mo", label:"St Barnabas, Mile Oak",       pick:"Mile Oak",          c:"#A4462E"},
  {k:"cw", label:"Canwell",                     pick:"Canwell",           c:"#573984"},
  {k:"ink",label:"Peel Parishes",               pick:"Multiple Churches", c:"#16211F"}
];
var CW_FULL="St Mary, St Giles & All Saints, Canwell";
var BY={}; CH.forEach(function(c){ BY[c.k]=c; });
var NEWS="News and updates";  /* the general-notices section: rename here only */
var SECTIONS=["This week","Coming up",NEWS,"Please pray","Help needed","Every week"];
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var CTAS=["Sign up","Book a place","Read more","Find out more","Visit their website","Give"];
var SITE="https://peelparishes.church/whats-on/";
var ROOT="https://peelparishes.church/";
var CHURCH_PAGE={db:"churches/stpeters",fz:"churches/stpauls",mo:"churches/stbarnabas",cw:"churches/canwell"};
/* Events use the month of the event (first session for a series); general
   notices use the month they were written. No date yet -> this month. */
function mmyy(d){ var t=d||new Date(); return pad2(t.getMonth()+1)+pad2(t.getFullYear()%100); }
function noticeUrl(title,mode,ch,when){
  if(mode==="ongoing") return CHURCH_PAGE[ch]? ROOT+CHURCH_PAGE[ch] : ROOT;
  if(mode==="none") return ROOT+"notices/"+mmyy()+"-"+slug(title);
  return SITE+mmyy(D(mode==="series"?when.start:when.date))+"-"+slug(title);
}
var KEY="peel:newsletter:v2", PREV="peel:newsletter:v2:prev";

var ROTA={
 1:[{c:"db",t:"09:30",s:"Morning Worship"},
    {c:"fz",t:"11:00",s:"Holy Communion",n:"with Kingdom Kids"},
    {c:"mo",t:"18:00",s:"Evening Praise Together"},
    {c:"cw",t:"11:00",s:"All Age Worship"}],
 2:[{c:"db",t:"09:30",s:"Warden Led Service"},
    {c:"fz",t:"11:00",s:"Morning Worship",n:"with Kingdom Kids"},
    {c:"mo",t:"09:00",s:"Morning Worship"},
    {c:"cw",t:"11:00",s:"Holy Communion",n:"Common Worship"}],
 3:[{c:"db",t:"09:30",s:"Holy Communion"},
    {c:"fz",t:"11:00",s:"Café Church",n:"all age"},
    {c:"fz",t:"18:00",s:"Evening Holy Communion"},
    {c:"cw",t:"11:00",s:"Warden Led Service"}],

function easterSunday(year){
  var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4;

  var h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4;
  var l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  var month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(year, month-1, day));
}

function buildChurchYear(startYear){
  var weeks = [];
  var advThis = adventSunday(startYear), advNext = adventSunday(startYear+1);
  var easter = easterSunday(startYear+1);
  var ashWed = addDays(easter, -46);
  var lent1Sunday = addDays(ashWed, 4);
  var palmSunday = addDays(easter, -7);
  var trinitySunday = addDays(easter, 56);

  for (var n=0;n<4;n++) weeks.push([addDays(weekStart(advThis), n*7), "Advent "+(n+1)]);

  var epiphanyFixed = new Date(Date.UTC(startYear+1,0,6));
  var baptismSunday;
  if (dow(epiphanyFixed)===0) baptismSunday = new Date(Date.UTC(startYear+1,0,13));
  else baptismSunday = addDays(epiphanyFixed, (7-dow(epiphanyFixed))%7);

  for (var n=0;n<4;n++) weeks.push([addDays(weekStart(baptismSunday), n*7), "Epiphany "+(n+1)]);

  var epiphanyBlockEnd = addDays(weekStart(baptismSunday), 28);
  var lent1Monday = weekStart(lent1Sunday);
  var nBeforeLent = Math.round((lent1Monday - epiphanyBlockEnd)/86400000/7);
  var useBL = nBeforeLent>0 ? BEFORE_LENT.slice(BEFORE_LENT.length-nBeforeLent) : [];
  useBL.forEach(function(lab,i){ weeks.push([addDays(epiphanyBlockEnd, i*7), lab]); });

  for (var n=0;n<5;n++) weeks.push([addDays(lent1Monday, n*7), "Lent "+(n+1)]);

  weeks.push([addDays(palmSunday,1), "Holy Week"]);
  weeks.push([addDays(easter,1), "Easter"]);
  for (var n=1;n<7;n++) weeks.push([addDays(easter, 1+7*n), "Easter "+(n+1)]);

  var pentecost = addDays(easter, 49);
  weeks.push([addDays(pentecost,1), "Pentecost"]);
  weeks.push([addDays(trinitySunday,1), "Trinity"]);

  var trinity1Monday = addDays(trinitySunday, 8);
  var beforeAdvStart = addDays(advNext, -28+1);
  var nTrinity = Math.max(0, Math.round((beforeAdvStart - trinity1Monday)/86400000/7));
  for (var n=0;n<nTrinity;n++) weeks.push([addDays(trinity1Monday,n*7), "Trinity "+(n+1)]);
  BEFORE_ADVENT.forEach(function(lab,i){ weeks.push([addDays(beforeAdvStart,i*7), lab]); });

  weeks.sort(function(a,b){ return a[0]-b[0]; });

}

function lectionaryReading(dateObj){
  var r = weekForDate(dateObj);

  var proper = properFor(dateObj);
  if (proper && proper.third)
    return {week:r.label, weekStart:r.weekStart, proper:proper.name,
            ot:proper.third.ot, nt:proper.third.nt};

  var dated = datedReadingFor(dateObj);
  if (dated){
    if (!YEAR_TABLE[r.churchYearStart])
      return {week:r.label, weekStart:r.weekStart, outOfRange:true};
    var yr = YEAR_TABLE[r.churchYearStart];
    var dot = dated[yr.sea.toLowerCase()] || dated.ot1;
    var dnt = dated[yr.seaNT.toLowerCase()] || dated.nt1;
    return {week:r.label, weekStart:r.weekStart, byDate:true, ot:dot, nt:dnt};
  }

  if (!YEAR_TABLE[r.churchYearStart]) return {week:r.label, weekStart:r.weekStart, outOfRange:true};
  var wk = READINGS[r.label];
  if (!wk) return {week:r.label, weekStart:r.weekStart, noData:true};

   6 January", so in years where Epiphany 1 starts early they stop short. */
function datedJanuaryApplies(d){
  var k = mdKey(d);
  if (!(k >= "01-07" && k <= "01-12")) return true;
  var epiph = new Date(Date.UTC(d.getUTCFullYear(), 0, 6));

  return d <= sat;

/* One lookup for every day that displaces the weekday tables. */
function properFor(d){

/* A handful of cells in the weekday table are festival markers rather than
   references -- ASH WEDNESDAY, ASCENSION DAY. Printing those as a reading
   would be worse than leaving the day blank. */
function isFestivalMarker(v){
  return !!v && /^[A-Z][A-Z ]{3,}$/.test(String(v).trim());
}

/* Why a given day cannot be filled from the weekday tables. Returns null when
   the day is fine. Shared by the fill button and by the note under the table,
   so the two can never disagree. */
function lectDayStatus(utc){
  var proper = properFor(utc);
  if(proper) return proper.third ? null : proper.name + " \u2014 its readings are set separately";
  if(datedReadingFor(utc) && datedPsalmFor(utc)) return null;
  var got = lectionaryReading(utc);
  if(got.outOfRange) return "outside the years the tables cover (2020\u20132044)";
  if(got.weekStart && got.weekStart.getTime() !== mondayOf(utc).getTime())
    return "falls between two blocks of the tables";
  /* Ash Wednesday and Ascension Day appear in the table as capitalised
     markers rather than references. Name them rather than saying nothing. */
  if(isFestivalMarker(got.ot) || isFestivalMarker(got.nt)){
    var marker = isFestivalMarker(got.ot) ? got.ot : got.nt;
    marker = String(marker).trim().toLowerCase().replace(/\b[a-z]/g,function(c){return c.toUpperCase();});
    return marker + " \u2014 its readings are set separately";
  }
  if(got.noData || !got.ot){
    /* Table 2 runs out at Trinity 22. In a year with a very early Easter
       there is one more week than the book provides for. */
    if(/^Trinity 2[3-9]/.test(got.week||""))
      return "a "+(got.week||"").toLowerCase()+" week, which Table 2 does not provide for";
    return "not in the weekday tables";
  }
  return null;
}

function lectFill(){
  var filled=0, outside=0, psalmGaps=0, skipped=[];
  var SHORTD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function label(utc){ return SHORTD[utc.getUTCDay()]+" "+utc.getUTCDate(); }

  S.readings.forEach(function(r){
    var d = D(r.date);
    if(!d){ outside++; return; }
    var utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));

    var proper = properFor(utc);
    if(proper && proper.third){
      if(!r.psalm){ r.psalm=tidyRef(proper.third.psalm); }
      if(!r.ot){ r.ot=tidyRef(proper.third.ot); }
      if(!r.nt){ r.nt=tidyRef(proper.third.nt); }
      filled++; return;
    }

    var why = lectDayStatus(utc);
    if(why){
      if(/outside the years/.test(why)) outside++; else skipped.push(label(utc));
      return;
    }
    var got = lectionaryReading(utc);

    var did=false;
    if(!r.ot && got.ot){ r.ot=tidyRef(got.ot); did=true; }
    if(!r.nt && got.nt){ r.nt=tidyRef(got.nt); did=true; }
    var ps = getPsalm(utc, got.week);
    if(!r.psalm){
      if(ps && ps.psalm){ r.psalm=tidyRef(ps.psalm); did=true; }
      else psalmGaps++;
    }
    if(did) filled++;
  });

  save(); renderStep(); renderSteps(); renderOut();

  var msg = "Filled "+filled+" day(s) from the Lectionary";
  if(psalmGaps) msg += ". Psalm not available for "+psalmGaps+" day"+(psalmGaps===1?"":"s");
  if(outside) msg += ". "+outside+" day"+(outside===1?"":"s")+" outside 2020\u20132044";
  if(skipped.length) msg += ". Left blank on purpose: "+skipped.join(", ")+" \u2014 see the note under the table";
  toast(msg);
}

function buildPlain(){
  var d=D(S.sunday), o=[];
  o.push("PEEL PARISHES");
  o.push("Going deeper with God, each other and the local community");
  if(d) o.push(longDate(d)+(S.season?" \u00b7 "+S.season:""));
  o.push("");
  /* Same running order as the email: the section head and date, then the
     theme, then the service times. */
  var g=groupedServices(), any=false;
  CH.forEach(function(ch){ if(g[ch.k]&&g[ch.k].length) any=true; });
  if(any || S.theme.title){
    o.push("THIS SUNDAY"); o.push("-----------"); o.push("");
  }
  if(S.theme.title){ o.push(S.theme.title.toUpperCase()); o.push(""); if(S.theme.body) o.push(S.theme.body); o.push(""); }
  if(any){
    o.push("JOIN US"); o.push("");
    CH.forEach(function(ch){
      var list=g[ch.k]; if(!list||!list.length) return;
      o.push((ch.k==="cw"&&S.cwFullSvc)?CW_FULL:ch.label);
      list.forEach(function(s){ var tt=timeRange(s.time,s.endTime); o.push(tt?"  "+(s.title||"Service")+"  "+tt+(s.note?" ("+s.note+")":""):"  No service this Sunday"); });
      o.push("");
    });
  }
  SECTIONS.forEach(function(sec){
    var gg=S.notices.filter(function(n){ return n.section===sec; });
    if(!gg.length) return;
    o.push(sec.toUpperCase()); o.push("-".repeat(sec.length)); o.push("");
    gg.forEach(function(n){
      o.push(labelFor(n)); o.push((n.cancelled?"CANCELLED: ":"")+n.title);
      var m=[], w=whenText(n);
      if(w) m.push(w); if(n.place) m.push(n.place);
      if(m.length) o.push(m.join(" \u00b7 "));
      var su=D(n.signUpBy); if(su&&today()<=su&&!n.cancelled) o.push("Sign up by "+longDate(su));
      if(n.body) o.push(n.body);
      if((n.url||"").trim()&&!n.cancelled) o.push((linkText(n)?linkText(n)+": ":"")+n.url.trim());
      var c=(n.who&&n.how)?n.who+" \u2014 "+n.how:(n.how||n.who||"");
      if(c) o.push("Contact: "+c);
      o.push("");
    });
  });
  if(S.dio.length){
    o.push("ACROSS THE DIOCESE"); o.push("------------------"); o.push("");
    S.dio.forEach(function(x){ o.push(x.title); if(x.line) o.push(x.line); if(x.url) o.push(x.url); o.push(""); });
  }
  if((S.prayer||"").trim()){ o.push("LET\u2019S PRAY"); o.push("-----------"); o.push(""); o.push(S.prayer.trim()); o.push(""); }
  var rr=S.readings.filter(function(r){ return r.psalm||r.ot||r.nt; });
  if(rr.length){
    o.push("READINGS FOR THE WEEK"); o.push("---------------------"); o.push("");
    rr.forEach(function(r){ var dd=D(r.date);
      o.push((dd?SHORT[dd.getDay()]+" "+dd.getDate()+"  ":"")+[r.psalm,r.ot,r.nt].filter(Boolean).join(" \u00b7 ")); });
    o.push("");
  }
  if(S.video.url){ o.push((S.video.label||"WATCH THIS WEEK")); if(S.video.caption) o.push(S.video.caption); o.push(S.video.url); o.push(""); }
  o.push("PEEL PARISHES OFFICE");
  o.push("*|LIST:ADDRESSLINE|*");
  o.push("01827 289414"); o.push("admin@peelparishes.church"); o.push("");
  o.push("Mon, Tue, Thu, Fri  09:00 \u2013 12:00"); o.push("Wed  14:00 \u2013 16:00"); o.push("Sun  10:30 \u2013 12:30");
  o.push(""); o.push("Unsubscribe: *|UNSUB|*");
  return o.join("\n").trim();
}

function renderSteps(){

    var b=document.createElement("button");
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", i===step?"true":"false");
    var count="";
    if(i===0) count=S.sunday? medDate(D(S.sunday)) : "";
    if(i===1) count=S.services.length?S.services.length+" services":"not set";
    if(i===2) count=S.notices.length?S.notices.length+" items":"none yet";
    if(i===3) count=S.dio.length?S.dio.length+" items":"none";
    if(i===5){ var f=S.readings.filter(function(r){return r.psalm||r.ot||r.nt;}).length;
      count=(f?f+"/6 days":"empty")+(S.video.url?" + video":""); }
    if(i===4) count=(S.prayer||"").trim()?"added":"none";
    b.innerHTML=s.n+'<span class="dot">'+(count||s.sub)+'</span>';
    b.onclick=function(){
      var same=(i===step);

/* ---- Printable notice card for whoever reads the notices in church.
   A4 landscape cut into four 74mm strips (or folded in half twice); content
   flows down strip 1, then 2, 3, 4, then onto a second sheet if it needs to.
   Heritage register and black-and-white safe: the church is a left rule plus
   its name in words. Finished and cancelled notices are left out. Ends with a
   blank box for the reader's own notes. ---- */
var PRINT_GROUPS=[
  {h:"This week",   f:function(n){ return n.section==="This week"&&n.mode!=="series"; }},
  {h:"Coming up",   f:function(n){ return n.section==="Coming up"&&n.mode!=="series"; }},
  {h:"Courses",     f:function(n){ return (n.section==="This week"||n.section==="Coming up")&&n.mode==="series"; }},
  {h:NEWS,          f:function(n){ return n.section===NEWS; }},
  {h:"Please pray", f:function(n){ return n.section==="Please pray"; }},
  {h:"Help needed", f:function(n){ return n.section==="Help needed"; }}
];  /* Every week is left off the printed card on purpose (decided 9 Nov). */
function shortUrl(u){ return String(u||"").trim().replace(/^https?:\/\/(www\.)?/i,"").replace(/\/$/,""); }
/* What goes on the notices card (the PDF). Printed card: church, title, date/time, venue, sign-up
   deadline, notice information and contact. No web addresses (decided 9 Nov). */
function cardGroups(){
  var live=S.notices.filter(function(n){ var st=status(n); return !n.cancelled&&!(st&&st.k==="done"); });
  return PRINT_GROUPS.map(function(g){
    return {h:g.h, items:live.filter(g.f).map(function(n){
      var su=D(n.signUpBy);
      return {c:(BY[n.church]||BY.ink).c, label:labelFor(n), title:n.title||"",
        meta:[whenText(n),n.place].filter(Boolean).join(" \u00b7 "),
        signup:(su&&today()<=su)?"Sign up by "+longDate(su):"", body:n.body||"",
        who:(n.who&&n.how)?n.who+" \u2014 "+n.how:(n.how||n.who||"")};
    })};
  }).filter(function(g){ return g.items.length; });
}
/* ---- The notices card as a PDF, on every device (10 Nov) ----
   Browsers print a web page with their own header/footer (web address, date,
   page number): always on iPhone and iPad, and on Chrome/Edge unless it is
   unticked. On iPad that shrank the page and pushed the card onto a blank
   second page. A PDF prints with none of that, so the card is drawn straight
   onto a canvas and wrapped as a one-page-per-sheet A4 PDF: phones and tablets
   get the share sheet (Print, Save to Files), computers get it in a new tab. Same content, order, fonts and sizes as the
   print window; laid out as four 74mm strips on landscape A4 so the dashed
   lines and the folds (in half twice) land in the same place. */
var CARD_DPI=240, CMM=CARD_DPI/25.4, CPT=CARD_DPI/72;

function cardKey(){ return JSON.stringify([S.sunday,S.season,cardGroups()]); }
function cardFontsReady(){

  var want=['400 40px Marcellus','400 40px "Source Sans 3"','500 40px "Source Sans 3"','600 40px "Source Sans 3"'];
  return Promise.race([
    Promise.all(want.map(function(f){ return document.fonts.load(f).catch(function(){}); })),
    new Promise(function(r){ setTimeout(r,3000); })]);

function prepCard(){

function buildCardPdf(){
  return cardFontsReady().then(function(){
    var W=Math.round(297*CMM), H=Math.round(210*CMM), STRIP=W/4;
    var PADX=6.5*CMM, PADT=10*CMM, PADB=10*CMM,   /* clear of printers' unprintable edge */
        INNER=STRIP-2*PADX, AVAIL=H-PADT-PADB;
    var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    var x=cv.getContext("2d"); x.textBaseline="middle";
    function font(w,pt,fam){ x.font=w+" "+(pt*CPT).toFixed(2)+"px "+fam; }
    function tw(s,ls){ return x.measureText(s).width+(ls?ls*s.length:0); }
    /* Word-wrap one style of text into lines; a single long word is broken by letters. */
    function wrap(s,maxW,ls){
      var out=[];
      String(s||"").split(/\r?\n/).forEach(function(para){
        var words=para.split(/\s+/).filter(Boolean), line="";
        if(!words.length){ out.push(""); return; }
        words.forEach(function(wd){
          var t=line?line+" "+wd:wd;
          if(tw(t,ls)<=maxW){ line=t; return; }
          if(line) out.push(line);
          while(tw(wd,ls)>maxW&&wd.length>1){
            var k=wd.length; while(k>1&&tw(wd.slice(0,k),ls)>maxW) k--;
            out.push(wd.slice(0,k)); wd=wd.slice(k);
          }
          line=wd;
        });
        out.push(line);
      });
      return out;
    }
    function put(s,px,py,ls){
      if(!ls){ x.fillText(s,px,py); return; }
      for(var i=0;i<s.length;i++){ x.fillText(s[i],px,py); px+=x.measureText(s[i]).width+ls; }
    }
    function rule(x0,y0,w,pt,col){ x.fillStyle=col; x.fillRect(x0,y0,w,Math.max(1,pt*CPT)); }
    /* A run of lines in one style: measured now, drawn later at any x/y. */
    function run(txt,w,pt,fam,lh,col,maxW,opt){
      opt=opt||{}; font(w,pt,fam);
      var ls=opt.ls?opt.ls*CPT:0, s=opt.upper?String(txt).toUpperCase():txt;
      var lines=wrap(s,maxW,ls), L=pt*lh*CPT;
      return {h:lines.length*L, draw:function(px,py){ font(w,pt,fam); x.fillStyle=col;
        lines.forEach(function(ln,i){ put(ln,px,py+L*i+L/2,ls); }); }};
    }
    var P=CPT, blocks=[];
    /* Masthead */
    (function(){
      var d=D(S.sunday);
      var a=run("Peel Parishes","400",17,CF_DISP,1.1,"#16211F",INNER),
          b=run("Notices"+(d?" · "+longDate(d):""),"600",10.5,CF_BOD,1.4,"#16211F",INNER);
      var h=a.h+2*P+b.h+4*P+1.2*P+2*P;
      blocks.push({h:function(){ return h; }, draw:function(L,T){
        a.draw(L,T); b.draw(L,T+a.h+2*P); rule(L,T+a.h+2*P+b.h+4*P,INNER,1.2,"#16211F"); }});
    })();
    if(S.season){ (function(){
      var r=run(S.season,"400",9.5,CF_BOD,1.4,"#5C6660",INNER);
      blocks.push({h:function(){ return 2*P+r.h+4*P; }, draw:function(L,T){ r.draw(L,T+2*P); }});
    })(); }
    cardGroups().forEach(function(g){
      var r=run(g.h,"600",9,CF_BOD,1.3,"#16211F",INNER,{upper:true,ls:1});
      blocks.push({head:true, h:function(first){ return (first?0:8*P)+0.5*P+3*P+r.h+4*P; },
        draw:function(L,T,first){ var y=T+(first?0:8*P); rule(L,y,INNER,0.5,"#B9C0BC"); r.draw(L,y+0.5*P+3*P); }});
      g.items.forEach(function(it){
        var IW=INNER-2.5*P-6*P, parts=[];
        parts.push([0, run(it.label,"600",8,CF_BOD,1.4,it.c,IW,{upper:true,ls:0.8})]);
        parts.push([1*P, run(it.title,"400",12.5,CF_DISP,1.2,"#16211F",IW), 2*P]);
        if(it.meta) parts.push([0, run(it.meta,"500",8.5,CF_BOD,1.4,"#16211F",IW)]);
        if(it.signup) parts.push([0, run(it.signup,"500",8.5,CF_BOD,1.4,"#16211F",IW)]);
        if(it.body) parts.push([2*P, run(it.body,"400",8.5,CF_BOD,1.4,"#525C58",IW), 2*P]);
        if(it.who) parts.push([0, run(it.who,"400",8.5,CF_BOD,1.4,"#525C58",IW)]);
        var inner=parts.reduce(function(s,p){ return s+p[0]+p[1].h+(p[2]||0); },0), box=1*P+inner+1*P;
        blocks.push({h:function(){ return box+7*P; }, draw:function(L,T){
          x.fillStyle=it.c; x.fillRect(L,T,2.5*P,box);
          var y=T+1*P; parts.forEach(function(p){ y+=p[0]; p[1].draw(L+2.5*P+6*P,y); y+=p[1].h+(p[2]||0); }); }});
      });
    });
    if(!blocks.some(function(b){ return b.head; })){
      var none=run("No notices yet.","400",10.5,CF_BOD,1.4,"#5C6660",INNER);
      blocks.push({h:function(){ return 6*P+none.h; }, draw:function(L,T){ none.draw(L,T+6*P); }});
    }
    /* Notes box: at least seven lines, then stretches to the foot of its strip. */
    var nLab=run("Notes and extra notices","600",8,CF_BOD,1.4,"#5C6660",INNER-10*P,{upper:true,ls:0.8}),
        LINE=7.5*CMM, nFix=8*P+3*P+nLab.h+4*P, notes={notes:true, lines:7,
        h:function(){ return nFix+notes.lines*LINE; },
        draw:function(L,T){ var y=T+8*P, hh=notes.lines*LINE+3*P+nLab.h+4*P;
          x.strokeStyle="#16211F"; x.lineWidth=0.75*P; x.setLineDash([]); x.strokeRect(L,y,INNER,hh);
          nLab.draw(L+5*P,y+3*P);
          for(var i=1;i<=notes.lines;i++) rule(L+5*P,y+3*P+nLab.h+i*LINE-0.5*P,INNER-10*P,0.5,"#B9C0BC"); }};
    /* Flow: down strip 1, then 2, 3, 4, then a new sheet. A heading never sits
       alone at the foot of a strip -- it moves on with the notice under it. */
    var strips=[], cur;
    function newStrip(){ cur={items:[],y:0}; strips.push(cur); }
    function place(b){ var first=!cur.items.length, h=b.h(first); cur.items.push({b:b,y:cur.y,first:first,h:h}); cur.y+=h; }
    newStrip();
    blocks.forEach(function(b){
      if(cur.items.length&&cur.y+b.h(false)>AVAIL){
        var carry=[];
        while(cur.items.length>1&&cur.items[cur.items.length-1].b.head){ var it=cur.items.pop(); cur.y-=it.h; carry.unshift(it.b); }
        newStrip(); carry.forEach(place);

    notes.lines=Math.max(7,7+Math.floor((AVAIL-cur.y-notes.h(!cur.items.length))/LINE));
    place(notes);

    var jpgs=[];
    for(var s0=0;s0<strips.length;s0+=4){
      x.setLineDash([]); x.fillStyle="#fff"; x.fillRect(0,0,W,H);
      x.strokeStyle="#8A918D"; x.lineWidth=0.5*P; x.setLineDash([1.6*CMM,1.2*CMM]);
      for(var c=1;c<4;c++){ x.beginPath(); x.moveTo(c*STRIP,0); x.lineTo(c*STRIP,H); x.stroke(); }
      x.setLineDash([]);
      for(var j=0;j<4&&s0+j<strips.length;j++){
        var L=(j*STRIP)+PADX;
        x.save(); x.beginPath(); x.rect(j*STRIP+1,0,STRIP-2,H); x.clip();
        strips[s0+j].items.forEach(function(it){ it.b.draw(L,PADT+it.y,it.first); });
        x.restore();
      }
      var u=cv.toDataURL("image/jpeg",0.9), bin=atob(u.slice(u.indexOf(",")+1)), a=new Uint8Array(bin.length);
      for(var q=0;q<bin.length;q++) a[q]=bin.charCodeAt(q);

    }

    return pdfFromJpegs(jpgs,W,H);
  });
}
/* Smallest possible PDF: one A4 landscape page per sheet, each a full-page JPEG. */
function pdfFromJpegs(jpgs,iw,ih){
  var enc=new TextEncoder(), parts=[], len=0, offs=[], n=jpgs.length, total=3+3*n;
  function push(v){ var b=typeof v==="string"?enc.encode(v):v; parts.push(b); len+=b.length; }
  function obj(i,f){ offs[i]=len; push(i+" 0 obj\n"); f(); push("\nendobj\n"); }
  push("%PDF-1.4\n%âãÏÓ\n");
  obj(1,function(){ push("<< /Type /Catalog /Pages 2 0 R >>"); });
  obj(2,function(){ push("<< /Type /Pages /Count "+n+" /Kids ["+jpgs.map(function(_,i){ return (3+3*i)+" 0 R"; }).join(" ")+"] >>"); });
  jpgs.forEach(function(j,i){
    var p=3+3*i, cs="q 841.89 0 0 595.28 0 0 cm /Im"+i+" Do Q";
    obj(p,function(){ push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im"+i+" "+(p+2)+" 0 R >> >> /Contents "+(p+1)+" 0 R >>"); });
    obj(p+1,function(){ push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"); });
    obj(p+2,function(){ push("<< /Type /XObject /Subtype /Image /Width "+iw+" /Height "+ih+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+j.length+" >>\nstream\n"); push(j); push("\nendstream"); });
  });
  var xref=len, rows="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(var i=1;i<total;i++) rows+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(rows+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}

      var t=document.createElement("div"); t.className="t";
      var b=document.createElement("b"); b.textContent=x.title;
      var s=document.createElement("small"); s.textContent=x.line||"";
      var wy=document.createElement("span"); wy.className="why drop"; wy.textContent="ran last week";
      t.appendChild(b); t.appendChild(s); t.appendChild(wy);
      row.appendChild(cb); row.appendChild(t); dlist.appendChild(row);
    });
    r.appendChild(dlist);
  }
  var foot=document.createElement("div"); foot.className="row";
  var go=document.createElement("button"); go.className="btn"; go.textContent="Start the week";
  var no=document.createElement("button"); no.className="btn ghost"; no.textContent="Cancel";
  go.onclick=function(){
    prev=JSON.stringify(S);
    var keep=[]; [].forEach.call(list.querySelectorAll("input"),function(cb){ if(cb.checked) keep.push(S.notices[+cb.dataset.i]); });
    var dk=[]; [].forEach.call(dlist.querySelectorAll("input"),function(cb){ if(cb.checked) dk.push(S.dio[+cb.dataset.d]); });
    S.sunday=iso(nx); S.season=""; S.services=[]; S.theme={title:"",body:"",image:""};
    S.notices=keep; S.dio=dk; S.video={label:"WATCH THIS WEEK",caption:"",url:"",thumb:""}; S.prayer="";
    buildReadings(); editIndex=-1; dioIndex=-1; save();
    r.hidden=true; step=1; renderSteps(); renderStep(); renderOut();
    toast("New week started \u2014 "+keep.length+" notices carried over");
  };
  no.onclick=function(){ r.hidden=true; };
  foot.appendChild(go); foot.appendChild(no); r.appendChild(foot);
  r.scrollTop=0;
}
function doUndo(){
  if(!prev) return;
  S=JSON.parse(prev); prev=null; save();
  step=0; renderSteps(); renderStep(); renderOut(); toast("Put back");
}

/* The preview iframe is its own viewport. At 600px it sits below the email's
   620px breakpoint, so the desktop preview was showing the phone layout of the
   readings table. Render at 700px -- wider than the breakpoint, as a real
   desktop client is -- then scale the frame down to fit the stage. */
var PREV_W=700;
function resizePreview(){
  var f=$("previewFrame"), inner=f.parentNode, phone=$("stage").classList.contains("phone");
  var w = phone ? 375 : PREV_W;
  var k = Math.min(1, inner.clientWidth / w);   /* phone view also shrinks to fit a narrow screen */
  f.style.width = w+"px";
  f.style.transform = k===1 ? "none" : "scale("+k+")";
  var h;
  try{ h = f.contentWindow.document.documentElement.scrollHeight+16; }
  catch(e){ h = 1400; }
  f.style.height = h+"px";
  inner.style.height = Math.round(h*k)+"px";
}
window.addEventListener("resize", resizePreview);
function renderOut(){
  var html=buildEmail();
  var f=$("previewFrame");
  f.srcdoc=html;
  f.onload=function(){ resizePreview();
    try{ f.contentWindow.document.fonts.ready.then(resizePreview); }catch(e){} };
  $("code").textContent=html;
  $("plain").textContent=buildPlain();
  var bytes=new Blob([html]).size, kb=bytes/1024, pct=Math.min(100,(kb/102)*100);
  $("kb").textContent=kb<1?Math.round(bytes)+" bytes":kb.toFixed(1)+" KB";
  var v=$("verdict");
  v.className=pct>85?"bad":(pct>60?"warn":"");
  if(pct<60) v.textContent="Comfortable.";
  else if(pct<85) v.textContent="Getting full \u2014 move the longest notices onto the website and link to them.";
  else v.textContent="Too long \u2014 Gmail will cut this off.";
}

/* Stacked-view navigation helpers. Both are no-ops on desktop, where nothing
   scrolls out of view in the first place. */
function scrollToSteps(){
  if(window.innerWidth>1000) return;
  /* Wait a frame: the step body has just been re-rendered, so measure after
     the new content has been laid out. The tabs bar is sticky, so its own
     rect is useless once it is stuck -- measure the panel below it instead
     and subtract the bar's height so the top of the panel clears it. */
  requestAnimationFrame(function(){
    var bar=$("steps"), body=$("stepbody");
    var top = window.pageYOffset + body.getBoundingClientRect().top - bar.offsetHeight;
    window.scrollTo({ top: Math.max(0, top), behavior:"smooth" });
  });
}
(function jumpToPreview(){
  var btn=$("jump"), target=$("stage");
  btn.onclick=function(){
    target.scrollIntoView({ behavior:"smooth", block:"start" });
  };
  function check(){
    if(window.innerWidth>1000){ btn.classList.remove("on"); return; }
    var r=target.getBoundingClientRect();
    var out = r.bottom < 120 || r.top > window.innerHeight;
    btn.classList.toggle("on", out);
  }
  window.addEventListener("scroll", check, {passive:true});
  window.addEventListener("resize", check);
  check();
})();

function view(w){ ["prev","plain","code"].forEach(function(x){
  $("t-"+x).setAttribute("aria-pressed", x===w?"true":"false"); $("v-"+x).hidden=x!==w; }); }
$("t-prev").onclick=function(){ view("prev"); };
$("t-plain").onclick=function(){ view("plain"); };
$("t-code").onclick=function(){ view("code"); };
$("t-wide").onclick=function(){ $("stage").classList.remove("phone");
  $("t-wide").setAttribute("aria-pressed","true"); $("t-phone").setAttribute("aria-pressed","false");
  setTimeout(resizePreview, 60); };
$("t-phone").onclick=function(){ $("stage").classList.add("phone");
  $("t-wide").setAttribute("aria-pressed","false"); $("t-phone").setAttribute("aria-pressed","true");
  setTimeout(resizePreview, 60); };

function copyText(t,ok){
  if(!t){ toast("Nothing to copy"); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){ toast(ok); }).catch(function(){ fb(t); });
  else fb(t);
}
function fb(t){ var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select the code and copy it"); }
  document.body.removeChild(ta); }
/* ---- Saving files on iPhone, iPad and Android (10 Nov) ----
   A download link does nothing useful there: Safari asks to allow downloads,
   drops the file that triggered the question, and in the Home Screen app
   downloads don't work at all. So on those devices the file goes to the share
   sheet instead -- Save Image, Save to Files, Print, AirDrop, Mail. iPadOS
   calls itself a Mac, so it is spotted by its touch screen. Computers keep
   the ordinary download. */
function touchOS(){ var ua=navigator.userAgent||"";
  return /iPad|iPhone|iPod|Android/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1); }
function downloadBlob(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; a.rel="noopener"; a.style.display="none";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  /* Safari can still be asking "Download?" when a short timer fires, which loses the file. */
  setTimeout(function(){ URL.revokeObjectURL(u); },60000);
}
function saveFile(blob,name,sharedMsg,savedMsg){
  var file=null; try{ file=new File([blob],name,{type:blob.type}); }catch(e){}
  if(touchOS()&&file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(function(){ if(sharedMsg) toast(sharedMsg); },function(err){
      if(err&&err.name==="AbortError") return;   /* they closed the share sheet */
      downloadBlob(blob,name); if(savedMsg) toast(savedMsg); });
    return;
  }
  downloadBlob(blob,name); if(savedMsg) toast(savedMsg);
}
function doDownload(){
  saveFile(new Blob([buildEmail()],{type:"text/html"}),"peel-newsletter-"+(S.sunday||"week")+".html",
    "Done", touchOS()?"Saved \u2014 look in the Files app, under Downloads":"");
}

/* ----------------------------------------------------------------
   Week file: save/open the whole working state as a small JSON file.
   For two volunteers alternating weeks -- localStorage lives on one
   machine only, so this is how a week hands over to someone else's
   computer. Complements localStorage rather than replacing it: the
   autosave still protects you against a closed tab; this is the
   deliberate handover.
---------------------------------------------------------------- */
function saveWeekFile(){
  var payload = JSON.stringify({peelWeekFile:1, saved:new Date().toISOString(), S:S}, null, 1);
  saveFile(new Blob([payload], {type:"application/json"}), "peel-week-"+(S.sunday||"draft")+".json",
    "Saved \u2014 hand this file to whoever's building next",
    "Saved \u2014 hand this file to whoever's building next");
}
function openWeekFile(){ $("weekFile").click(); }
$("weekFile").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    var data;
    try{ data = JSON.parse(String(ev.target.result)); }
    catch(err){ toast("That doesn't look like a week file"); return; }
    if(!data || !data.S){ toast("That doesn't look like a week file"); return; }
    if(!confirm("Open "+(data.S.sunday||"this week")+"? This replaces what's currently open here.")) return;
    S = Object.assign({sunday:"",season:"",preheader:"Going deeper with God, each other and the local community. Coming up this Sunday and next week.",logo:S.logo,cwFullSvc:false,services:[],
      theme:{title:"",body:"",image:""},notices:[],dio:[],readings:[],
      prayer:"", video:{label:"WATCH THIS WEEK",caption:"",url:"",thumb:""}}, data.S);
    editIndex=-1; dioIndex=-1; save();
    step=1; renderSteps(); renderStep(); renderOut();
    toast("Opened "+(data.saved ? "a week saved "+new Date(data.saved).toLocaleDateString("en-GB") : "the week file"));
  };
  r.readAsText(f);
  e.target.value = "";   // allow opening the same filename again later
});
load();
})();
</script>
